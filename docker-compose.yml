services:
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: komsync-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://host.docker.internal:5237}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
